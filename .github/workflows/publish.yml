name: Publish to CocoaPods

# Publishes the DocuPass pod to CocoaPods trunk when a version tag (v*) is pushed.
# The tag must match the podspec version (e.g. v0.1.0 -> s.version 0.1.0).
#
# Required repository secret:
#   COCOAPODS_TRUNK_TOKEN  - a CocoaPods trunk session token. Generate with:
#     pod trunk register support@idanalyzer.com 'ID Analyzer'
#   then copy the token from ~/.netrc (machine trunk.cocoapods.org).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: pod trunk push
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        # Static-framework packaging is declared in the podspec
        # (s.static_framework = true) so the MediaPipe static binary validates;
        # pod trunk push has no --use-static-frameworks flag.
        run: |
          set +e
          VERSION="$(ruby -e "podspec = File.read('DocuPass.podspec'); puts podspec[/s\\.version\\s*=\\s*['\\\"]([^'\\\"]+)['\\\"]/, 1]")"

          if pod trunk info DocuPass | grep -q -- "- $VERSION "; then
            echo "DocuPass $VERSION is already published to CocoaPods trunk."
            exit 0
          fi

          pod trunk push DocuPass.podspec --allow-warnings
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi

          echo "pod trunk push exited with $STATUS; checking whether trunk accepted the version anyway..."
          if pod trunk info DocuPass | grep -q -- "- $VERSION "; then
            echo "DocuPass $VERSION is visible on CocoaPods trunk after the failed response."
            exit 0
          fi

          exit "$STATUS"
